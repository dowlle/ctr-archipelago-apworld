name: CTR tag guard

# A version tag needs the full fuzz matrix: this fails unless the tagged commit
# has a CTR world run in which pytest, pack and every arm of
# .github/fuzz/ctr-world-matrix.yml passed. Run it by hand on a branch to check
# that branch's head before tagging. See .github/fuzz/README.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: full CTR fuzz on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find a green full-tier run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML==6.0.2'
          python .github/scripts/ctr_tag_guard.py \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --matrix-file .github/fuzz/ctr-world-matrix.yml
