name: CTR world

# The CTR world's own checks. The inherited upstream Archipelago workflows stay
# disabled on this fork; this one runs only what the world needs: its pytest
# suite and the content-plan fuzz matrix against a .apworld packed from this
# commit. The inherited quality hooks retain their run counts; all metas now
# use the single content-plan generator, including default and tracker arms.
# The arms live in .github/fuzz/ctr-world-matrix.yml; the classify job picks
# the none, pr or full tier (.github/fuzz/README.md).

on:
  pull_request:
    paths:
      - 'worlds/ctr/**'
      - '.github/workflows/ctr-world.yml'
      - '.github/fuzz/**'
      - '.github/scripts/**'
      - '*.md'
      - '**/*.md'
  push:
    branches: [main, 'dev/**', 'release/**', 'ci/**']
    paths:
      - 'worlds/ctr/**'
      - '.github/workflows/ctr-world.yml'
      - '.github/fuzz/**'
      - '.github/scripts/**'
      - '*.md'
      - '**/*.md'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    # Manual runs use the selected branch and always run the full tier. The
    # schedule only dispatches the nightly dev run (schedules fire on main).
    inputs:
      nightly:
        description: Internal marker for the scheduled dev run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AP_VERSION: '0.6.7'
  PYTHON_VERSION: '3.12'
  # Pinned to the same commits as dowlle/Archipelago-index fuzz.yml so a PR here
  # and the publication gate cannot disagree on verdict semantics. The one
  # deliberate difference is the check-ut arm in ctr-world-matrix.yml, which runs the real
  # Universal Tracker hook instead of the index's placeholder.
  FUZZ_HOOKS_REPO: dowlle/apworld-fuzz-hooks
  FUZZ_HOOKS_REF: 38215940cb45a9258bc1e205de0240ea3f92b471
  FUZZER_COMMIT: acc0a12309bdd9b5d58f97ab5c3cfb8bc258525e
  # Universal Tracker, pinned to the released build the local fuzz matrix uses.
  # The check-ut arm imports worlds.tracker.fuzzer_hook from this file, so the
  # arm only means anything when this world is installed. Never move this to a
  # "latest" download: the checksum below is what makes the fetch trustworthy.
  TRACKER_VERSION: 'v0.2.26'
  TRACKER_SHA256: 'ce5674e899d0303f156d43f2c8ebe026498031bf7cd3382524c1d02ee359d463'

jobs:
  classify:
    name: classify CTR fuzz tier
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      matrix: ${{ steps.tier.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Select fuzz tier and arms
        id: tier
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths="$RUNNER_TEMP/ctr-changed-paths"
          : > "$paths"
          # Only pull requests look at the changed paths; pushes never skip fuzz.
          # The PR file list is the diff against the merge base, so commits that
          # land on the base branch meanwhile do not count as changes here.
          # Renames list both names. A failed or truncated list (GitHub stops
          # at 3000 files) stays empty, which selects the pr tier.
          # Labels are read live, not from the event, so adding full-fuzz and
          # then re-running the workflow (or pushing) selects the full tier.
          labels='[]'
          if [[ "$EVENT_NAME" == pull_request ]]; then
            labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name]')"
            echo "Labels: $labels"
            if gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
                --jq '.[] | (.filename, (.previous_filename // empty)) | @json' > "$RUNNER_TEMP/pr-files"; then
              if [[ "$(wc -l < "$RUNNER_TEMP/pr-files")" -lt 3000 ]]; then
                # One JSON string per line keeps a newline inside a file name
                # from splitting it into two paths.
                python -c 'import json, sys; sys.stdout.write("".join(json.loads(line) + "\0" for line in open(sys.argv[1]) if line.strip()))' \
                  "$RUNNER_TEMP/pr-files" > "$paths"
              fi
            fi
            echo "Changed paths:"; tr '\0' '\n' < "$paths"
          fi
          python -m pip install 'PyYAML==6.0.2'
          python -m unittest discover -s .github/scripts -p 'test_ctr_fuzz_tiers.py'
          python .github/scripts/ctr_fuzz_tiers.py \
            --event "$EVENT_NAME" \
            --ref "$GIT_REF" \
            --labels-json "$labels" \
            --paths-file "$paths" \
            --matrix-file .github/fuzz/ctr-world-matrix.yml \
            --output "$GITHUB_OUTPUT"

  tests:
    name: pytest worlds/ctr
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published named-track lock (freeze baseline)
        shell: bash
        run: |
          set -euo pipefail
          # The lock in this branch can be regenerated, so the freeze test
          # compares against the copy from the PR base (or the previous
          # commit on a push). Absent in the base means first introduction.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          out="$RUNNER_TEMP/named_tracks_lock.baseline.json"
          : > "$out"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
              && git fetch --depth=1 origin "$base" 2>/dev/null; then
            git show "FETCH_HEAD:worlds/ctr/test/fixtures/named_tracks_lock.json" > "$out" 2>/dev/null || : > "$out"
          fi
          echo "CTR_NAMED_LOCK_BASELINE=$out" >> "$GITHUB_ENV"
          wc -c "$out"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          # ModuleUpdate above already installed everything. Launcher would run the
          # requirement check again and, on a pinned-version mismatch left by pip's
          # resolver, prompt on stdin, which has no terminal here (EOFError seen on
          # 2 of the first 4 runs). SKIP_REQUIREMENTS_UPDATE is ModuleUpdate's own
          # opt-out for exactly this.
          SKIP_REQUIREMENTS_UPDATE=1 python Launcher.py --update_settings
      - name: Run the CTR suite
        run: pytest worlds/ctr -n auto -q

  pack:
    name: pack ctr.apworld
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          out="$(python3 worlds/ctr/tools/build_apworld.py "$PWD/ctr.apworld")"
          echo "$out"
          echo "sha256=$(echo "$out" | cut -f2)" >> "$GITHUB_OUTPUT"
          unzip -l ctr.apworld | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ctr.apworld
          path: ctr.apworld
          retention-days: 7

  fuzz:
    name: fuzz / ${{ matrix.check_name }}
    needs: [classify, pack]
    if: needs.classify.outputs.tier != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.matrix) }}
    steps:
      - name: Checkout index repo scripts (canonical generation check)
        uses: actions/checkout@v4
        with:
          repository: dowlle/Archipelago-index
          path: index-repo
      - name: Checkout .github/fuzz (fuzz metas and the CTR tracker hook)
        if: matrix.check_meta == 'random' || matrix.check_meta == 'accessibility-full' || matrix.check_meta == 'content-plan-030' || matrix.check_meta == 'content-plan' || matrix.check_meta == 'content-plan-cups' || matrix.check_meta == 'content-plan-bosses' || matrix.check_meta == 'content-plan-full' || matrix.check_meta == 'content-plan-vanilla' || matrix.check_meta == 'content-plan-132' || startsWith(matrix.check_meta, 'gem-cups-') || startsWith(matrix.check_meta, 'pads-') || matrix.check_tracker == 'yes'
        uses: actions/checkout@v4
        with:
          path: world-src
          sparse-checkout: .github/fuzz
      - name: Checkout fuzz hooks
        if: matrix.check_mode == 'fuzz'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FUZZ_HOOKS_REPO }}
          ref: ${{ env.FUZZ_HOOKS_REF }}
          path: fuzz-hooks
      - name: Setup Archipelago
        uses: Eijebong/ap-actions/setup-ap@main
        with:
          version: ${{ env.AP_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stage hooks, empty.apworld and fuzz.py
        if: matrix.check_mode == 'fuzz'
        shell: bash
        run: |
          set -euo pipefail
          cp -r fuzz-hooks/hooks archipelago/hooks
          cp fuzz-hooks/empty.apworld archipelago/custom_worlds/empty.apworld
          curl -SsL --fail -o archipelago/fuzz.py \
            "https://raw.githubusercontent.com/Eijebong/Archipelago-fuzzer/${FUZZER_COMMIT}/fuzz.py"
      - name: Install the pinned Universal Tracker world
        if: matrix.check_tracker == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          curl -SsL --fail -o archipelago/custom_worlds/tracker.apworld \
            "https://github.com/FarisTheAncient/Archipelago/releases/download/Tracker_${TRACKER_VERSION}/tracker.apworld"
          echo "${TRACKER_SHA256}  archipelago/custom_worlds/tracker.apworld" | sha256sum -c -
          # The tracker reads settings.universal_tracker.player_files_path, which
          # defaults to "Players" and is a UserFolderPath: reading it raises
          # FileNotFoundError when the folder does not exist. A fresh Archipelago
          # checkout has no Players folder, so without this line every generation
          # the hook inspects fails. A developer's own Archipelago install has
          # one already, which is why the local fuzz matrix never saw this.
          mkdir -p archipelago/Players
      - name: Stage the CTR tracker hook (compares by location id)
        if: matrix.check_hook == 'hooks.ctr_ut_hook:Hook'
        shell: bash
        run: cp world-src/.github/fuzz/ctr_ut_hook.py archipelago/hooks/ctr_ut_hook.py
      - uses: actions/download-artifact@v4
        with:
          name: ctr.apworld
          path: packed
      - name: Install the packed apworld
        shell: bash
        run: |
          set -euo pipefail
          cp packed/ctr.apworld archipelago/custom_worlds/ctr.apworld
          echo "sha256 $(sha256sum archipelago/custom_worlds/ctr.apworld | cut -d' ' -f1) (pack job said ${{ needs.pack.outputs.sha256 }})"
      - name: Run generation check
        shell: bash
        working-directory: archipelago
        env:
          CHECK_NAME: ${{ matrix.check_name }}
          CHECK_RUNS: ${{ matrix.check_runs }}
          CHECK_HOOK: ${{ matrix.check_hook }}
          CHECK_MODE: ${{ matrix.check_mode }}
          CHECK_META: ${{ matrix.check_meta }}
        run: |
          set -euo pipefail
          echo "=== ${CHECK_NAME} (${CHECK_RUNS} runs) ==="
          if [ "$CHECK_MODE" = "canonical" ]; then
            uv run python ../index-repo/.github/scripts/check_canonical_generation.py \
              --module ctr --artifact-dir canonical_output --seed 0
            exit 0
          fi
          extra_args=()
          if [ -n "$CHECK_HOOK" ]; then
            extra_args+=(--hook "$CHECK_HOOK")
          fi
          if [ "$CHECK_META" = "accessibility-full" ]; then
            { cat ../world-src/.github/fuzz/random-meta.yaml; printf '  accessibility: full\n  custom_tracks: []\n'; } > ci_meta.yaml
            cat ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "random" ]; then
            cp ../world-src/.github/fuzz/random-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "check-ut-custom-tracks" ]; then
            cp ../world-src/.github/fuzz/check-ut-custom-tracks-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan" ]; then
            cp ../world-src/.github/fuzz/content-plan-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-cups" ]; then
            cp ../world-src/.github/fuzz/content-plan-cups-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-bosses" ]; then
            cp ../world-src/.github/fuzz/content-plan-bosses-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-full" ]; then
            cp ../world-src/.github/fuzz/content-plan-full-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-vanilla" ]; then
            cp ../world-src/.github/fuzz/content-plan-vanilla-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-132" ]; then
            python3 ../world-src/.github/fuzz/custom-tracks-132.py ../world-src/.github/fuzz/content-plan-vanilla-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-030" ]; then
            cp ../world-src/.github/fuzz/content-plan-030-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [[ "$CHECK_META" == gem-cups-* ]]; then
            IFS=- read -r _ _ cups cup_tracks <<< "$CHECK_META"
            sed -e "s/__COUNT__/$cups/" -e "s/__TRACKS__/$cup_tracks/" ../world-src/.github/fuzz/content-plan-gem-cups-meta.yaml > ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [[ "$CHECK_META" == pads-* ]]; then
            IFS=- read -r _ unlock placement density fixed overlay <<< "$CHECK_META"
            sed -e "s/__UNLOCK__/$unlock/" -e "s/__PLACEMENT__/$placement/" -e "s/__DENSITY__/$density/" ../world-src/.github/fuzz/content-plan-pads-meta.yaml > ci_meta.yaml
            if [[ "$fixed" == keys || "$fixed" == both || "$fixed" == all ]]; then
              sed -i 's/^  shuffle_keys: .*/  shuffle_keys: false/' ci_meta.yaml
            fi
            if [[ "$fixed" == gems || "$fixed" == both || "$fixed" == all ]]; then echo "  shuffle_gems: false" >> ci_meta.yaml; fi
            if [[ "$fixed" == filler || "$fixed" == all ]]; then
              sed -i -e 's/^  oxide_goal: .*/  oxide_goal: 101_percent/' -e 's/^  oxide_1_optional: .*/  oxide_1_optional: filler/' ci_meta.yaml
            fi
            if [[ -n "$overlay" ]]; then python3 ../world-src/.github/fuzz/apply-overlay.py ci_meta.yaml "../world-src/.github/fuzz/overlays/$overlay.yaml"; fi
            extra_args+=(-m ci_meta.yaml)
          fi
          uv run python fuzz.py -j 2 -g ctr -r "$CHECK_RUNS" -n 1 -t 120 "${extra_args[@]}" | tee fuzz.log
          if [ "$CHECK_META" = "content-plan" ] || [ "$CHECK_META" = "content-plan-cups" ] || [ "$CHECK_META" = "content-plan-bosses" ] || [ "$CHECK_META" = "content-plan-full" ] || [ "$CHECK_META" = "content-plan-vanilla" ] || [ "$CHECK_META" = "content-plan-132" ] || [[ "$CHECK_META" == gem-cups-* ]] || [[ "$CHECK_META" == pads-* ]]; then
            # A refused option set is "ignored", not a failure. If the meta file
            # stopped matching the profile, every seed would be ignored and the
            # arm would pass without testing anything, so cap the ignored share.
            ignored="$(grep -oE '[0-9]+ ignored' fuzz.log | tail -1 | cut -d' ' -f1)"
            echo "content-plan ignored: ${ignored:-unknown} of ${CHECK_RUNS}"
            if [ -z "$ignored" ] || [ "$ignored" -gt $((CHECK_RUNS / 10)) ]; then
              echo "::error::content-plan arm: too many ignored generations (${ignored:-unknown} of ${CHECK_RUNS})"
              exit 1
            fi
          fi
      - name: Name the failing generations
        # The nightly issue reads these annotations to list arm and seed.
        if: failure()
        shell: bash
        working-directory: archipelago
        env:
          CHECK_NAME: ${{ matrix.check_name }}
          CHECK_MODE: ${{ matrix.check_mode }}
        run: |
          shopt -s nullglob
          if [ "$CHECK_MODE" = "canonical" ]; then
            echo "::error title=CTR fuzz failure::arm=${CHECK_NAME} canonical generation, seed 0"
            exit 0
          fi
          # The pinned fuzzer draws a random Archipelago seed and does not log
          # it, so a failure is named by its run number, its YAML in the
          # fuzz-failure artifact and its last error line.
          n=0
          for log in fuzz_output/error/*/*/*.log fuzz_output/timeout/*/*/*.log; do
            kind="$(basename "$(dirname "$(dirname "$(dirname "$log")")")")"
            run="$(basename "$log" .log)"
            yamls="$(cd "$(dirname "$log")" && ls -- *.yaml 2>/dev/null | tr '\n' ' ')"
            err="$(grep -E '^[A-Za-z_][A-Za-z0-9_.]*(Error|Exception)(:|$)' "$log" | tail -1 | cut -c1-200 || true)"
            if [ "$kind" = timeout ]; then err="timed out"; fi
            echo "::error title=CTR fuzz failure::arm=${CHECK_NAME} ${kind} run=${run} yaml=${yamls% } ${err:-no error line}"
            n=$((n + 1))
            # GitHub keeps 10 error annotations per step.
            if [ "$n" -ge 9 ]; then break; fi
          done
          total="$(ls -d fuzz_output/error/*/*/ fuzz_output/timeout/*/*/ 2>/dev/null | wc -l)"
          if [ "$total" -gt "$n" ]; then
            echo "::error title=CTR fuzz failure::arm=${CHECK_NAME} and $((total - n)) more failed generations, all in the fuzz-failure artifact"
          fi
          if [ "$n" -eq 0 ]; then
            echo "::error title=CTR fuzz failure::arm=${CHECK_NAME} no failing seed in fuzz_output (see the job log)"
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.check_name }}
          path: |
            archipelago/fuzz_output
            archipelago/canonical_output
          if-no-files-found: ignore
          retention-days: 14

  nightly-dev-dispatch:
    name: start nightly dev CTR run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'ctr-world.yml',
              ref: 'dev/custom-pad-0.3.0',
              inputs: {nightly: 'true'},
            });

  nightly-failure-issue:
    name: report nightly CTR fuzz failure
    needs: [classify, tests, pack, fuzz, nightly-dev-dispatch]
    # The schedule reports a failed dispatch; the dispatched dev run reports
    # its own failed jobs.
    if: ${{ always() && ((github.event_name == 'schedule' && needs.nightly-dev-dispatch.result != 'success') || (github.event_name == 'workflow_dispatch' && inputs.nightly && (needs.classify.result != 'success' || needs.tests.result != 'success' || needs.pack.result != 'success' || needs.fuzz.result != 'success'))) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // One open issue collects every nightly failure: the first one
            // opens it, later ones add a comment, closing it starts afresh.
            const title = 'Nightly CTR fuzz failure';
            const {owner, repo} = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, per_page: 100,
            });
            const failed = jobs.filter(job => ['failure', 'cancelled'].includes(job.conclusion));
            const failingArms = [];
            for (const job of failed.filter(job => job.name.startsWith('fuzz / '))) {
              const arm = job.name.slice('fuzz / '.length);
              const notes = await github.paginate(github.rest.checks.listAnnotations, {
                owner, repo, check_run_id: job.id, per_page: 100,
              });
              const seeds = notes.filter(note => note.title === 'CTR fuzz failure').map(note => note.message);
              failingArms.push(`- ${arm} (${job.conclusion})`, ...seeds.map(seed => `  - ${seed}`));
            }
            const otherFailures = failed
              .filter(job => !job.name.startsWith('fuzz / '))
              .map(job => `- ${job.name} (${job.conclusion})`);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const what = context.eventName === 'schedule'
              ? 'The nightly dev dispatch failed'
              : `Nightly full CTR fuzz run on ${context.ref.replace('refs/heads/', '')} at ${context.sha.slice(0, 9)} failed`;
            const body = [
              `${what}: ${runUrl}`,
              '',
              'Failing arms, with run number, YAML and error for each failed generation (the YAMLs are in the run\'s fuzz-failure artifacts):',
              ...(failingArms.length ? failingArms : ['- None.']),
              '',
              'Other failed jobs:',
              ...(otherFailures.length ? otherFailures : ['- None.']),
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = open.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body});
              core.info(`Updated #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({owner, repo, title, body});
              core.info(`Opened #${created.data.number}`);
            }

  # Branch protection should require only "ctr-world summary" from this workflow.
  summary:
    name: ctr-world summary
    needs: [classify, tests, pack, fuzz, nightly-dev-dispatch, nightly-failure-issue]
    # The schedule only dispatches the dev run, which has its own summary.
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check required CTR jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ['NEEDS_JSON'])
          tier = needs['classify']['outputs'].get('tier')
          expected = {
              'classify': {'success'},
              'tests': {'success'},
              'pack': {'success'},
              'fuzz': {'success', 'skipped'} if tier == 'none' else {'success'},
              'nightly-dev-dispatch': {'success', 'skipped'},
              'nightly-failure-issue': {'success', 'skipped'},
          }
          bad = [f'{name}: {needs[name]["result"]}' for name, allowed in expected.items()
                 if needs[name]['result'] not in allowed]
          print(f'CTR tier: {tier}; ' + ', '.join(
              f'{name}: {job["result"]}' for name, job in needs.items()))
          if bad:
              print('Unexpected job results: ' + ', '.join(bad), file=sys.stderr)
              sys.exit(1)
          PY
