name: CTR world

# The CTR world's own checks. The inherited upstream Archipelago workflows stay
# disabled on this fork; this one runs only what the world needs: its pytest
# suite, and the same eleven-arm fuzz matrix the Archipelago-index runs at
# publication time, against a .apworld packed from this commit, plus a forced
# content-plan arm (#133 PR 2) that the index does not run.

on:
  pull_request:
    paths:
      - 'worlds/ctr/**'
      - '.github/workflows/ctr-world.yml'
      - '.github/fuzz/**'
  push:
    branches: [main, 'release/**', 'ci/**']
    paths:
      - 'worlds/ctr/**'
      - '.github/workflows/ctr-world.yml'
      - '.github/fuzz/**'

permissions:
  contents: read

env:
  AP_VERSION: '0.6.7'
  PYTHON_VERSION: '3.12'
  # Pinned to the same commits as dowlle/Archipelago-index fuzz.yml so a PR here
  # and the publication gate cannot disagree on verdict semantics. The one
  # deliberate difference is the check-ut arm below, which runs the real
  # Universal Tracker hook instead of the index's placeholder.
  FUZZ_HOOKS_REPO: dowlle/apworld-fuzz-hooks
  FUZZ_HOOKS_REF: 38215940cb45a9258bc1e205de0240ea3f92b471
  FUZZER_COMMIT: acc0a12309bdd9b5d58f97ab5c3cfb8bc258525e
  # Universal Tracker, pinned to the released build the local fuzz matrix uses.
  # The check-ut arm imports worlds.tracker.fuzzer_hook from this file, so the
  # arm only means anything when this world is installed. Never move this to a
  # "latest" download: the checksum below is what makes the fetch trustworthy.
  TRACKER_VERSION: 'v0.2.26'
  TRACKER_SHA256: 'ce5674e899d0303f156d43f2c8ebe026498031bf7cd3382524c1d02ee359d463'

jobs:
  tests:
    name: pytest worlds/ctr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published named-track lock (freeze baseline)
        shell: bash
        run: |
          set -euo pipefail
          # The lock in this branch can be regenerated, so the freeze test
          # compares against the copy from the PR base (or the previous
          # commit on a push). Absent in the base means first introduction.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          out="$RUNNER_TEMP/named_tracks_lock.baseline.json"
          : > "$out"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
              && git fetch --depth=1 origin "$base" 2>/dev/null; then
            git show "FETCH_HEAD:worlds/ctr/test/fixtures/named_tracks_lock.json" > "$out" 2>/dev/null || : > "$out"
          fi
          echo "CTR_NAMED_LOCK_BASELINE=$out" >> "$GITHUB_ENV"
          wc -c "$out"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          # ModuleUpdate above already installed everything. Launcher would run the
          # requirement check again and, on a pinned-version mismatch left by pip's
          # resolver, prompt on stdin, which has no terminal here (EOFError seen on
          # 2 of the first 4 runs). SKIP_REQUIREMENTS_UPDATE is ModuleUpdate's own
          # opt-out for exactly this.
          SKIP_REQUIREMENTS_UPDATE=1 python Launcher.py --update_settings
      - name: Run the CTR suite
        run: pytest worlds/ctr -n auto -q

  pack:
    name: pack ctr.apworld
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          out="$(python3 worlds/ctr/tools/build_apworld.py "$PWD/ctr.apworld")"
          echo "$out"
          echo "sha256=$(echo "$out" | cut -f2)" >> "$GITHUB_OUTPUT"
          unzip -l ctr.apworld | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ctr.apworld
          path: ctr.apworld
          retention-days: 7

  fuzz:
    name: fuzz / ${{ matrix.check_name }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {check_name: canonical-default,           check_runs: 1,    check_hook: '',                                                          check_mode: canonical}
          - {check_name: default,                     check_runs: 5000, check_hook: '',                                                          check_mode: fuzz}
          - {check_name: no-restrictive-starts,       check_runs: 5000, check_hook: 'hooks.no_rs:Hook',                                          check_mode: fuzz}
          - {check_name: check-determinism,           check_runs: 500,  check_hook: 'hooks.determinism:Hook',                                    check_mode: fuzz}
          - {check_name: check-collect-accessibility, check_runs: 500,  check_hook: 'hooks.collect_accessibility_test:Hook',                     check_mode: fuzz}
          - {check_name: check-item-location-count,   check_runs: 500,  check_hook: 'hooks.item_location_count:Hook',                            check_mode: fuzz}
          - {check_name: check-placement-refs,        check_runs: 500,  check_hook: 'hooks.check_placement_item_location_references:Hook',       check_mode: fuzz}
          - {check_name: check-lambda-capture,        check_runs: 500,  check_hook: 'hooks.detect_rule_variable_capture_issues:Hook',            check_mode: fuzz}
          - {check_name: check-static-output,         check_runs: 500,  check_hook: 'hooks.detect_output_placement_changes:Hook',                check_mode: fuzz}
          - {check_name: check-indirect-conditions,   check_runs: 500,  check_hook: 'hooks.indirect_conditions:Hook',                            check_mode: fuzz}
          # check-ut compares Universal Tracker's logic with the server's own
          # logic, so it needs the tracker world installed and its own hook. It
          # also forces accessibility: full, because a tracker divergence shows
          # up as locations the server reached and the tracker did not.
          # Both tracker arms run .github/fuzz/ctr_ut_hook.py, which runs the
          # tracker's own hook and compares checks by location id, because the
          # tracker shows generic-slot custom-track checks under their room
          # title (#306 B+). check-ut keeps the plain world (`custom_tracks: {}`);
          # check-ut-custom-tracks replaces the Purple Gem Cup with the legacy
          # `custom_tracks` Baby T Park entry on every seed, from
          # .github/fuzz/check-ut-custom-tracks-meta.yaml (ruling of 2026-10-18,
          # superseding the 2026-10-13 exclusion).
          - {check_name: check-ut,                    check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook',                                    check_mode: fuzz, check_tracker: 'yes', check_meta: 'accessibility-full'}
          - {check_name: check-ut-custom-tracks,      check_runs: 1000, check_hook: 'hooks.ctr_ut_hook:Hook',                                    check_mode: fuzz, check_tracker: 'yes', check_meta: 'check-ut-custom-tracks'}
          # Forced content plan (#133 PR 2): the default options never build
          # one, so this arm pins an explicit content_pool with two custom
          # tracks (one named block, one generic B+ slot) from
          # .github/fuzz/content-plan-meta.yaml and randomizes the rest.
          - {check_name: content-plan,                check_runs: 1000, check_hook: '',                                                          check_mode: fuzz, check_meta: 'content-plan'}
          # Universal Tracker on the forced content plan (#133). The meta has a
          # generic-slot (B+) track, whose checks the tracker shows under their
          # room title. The upstream hook compares checks by name, so this arm
          # runs .github/fuzz/ctr_ut_hook.py, which runs that hook and compares
          # by location id instead. It uses the content-plan meta and its
          # ignored-share cap, and the same pinned tracker as check-ut.
          - {check_name: content-plan-ut,             check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook',                                    check_mode: fuzz, check_tracker: 'yes', check_meta: 'content-plan'}
          # Cups on the forced content plan (#133 PR 5): the content-plan meta
          # with one to eight cups over every leg source, from
          # .github/fuzz/content-plan-cups-meta.yaml, under the same cap.
          - {check_name: content-plan-cups,           check_runs: 1000, check_hook: '',                                                          check_mode: fuzz, check_meta: 'content-plan-cups'}
          # Boss garages on the forced content plan (#133 PR 6): the cups meta
          # with bosses on and the goal and boss options drawn, from
          # .github/fuzz/content-plan-bosses-meta.yaml, under the same cap.
          - {check_name: content-plan-bosses,         check_runs: 1000, check_hook: '',                                                          check_mode: fuzz, check_meta: 'content-plan-bosses'}
          - {check_name: content-plan-bosses-ut,      check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook',                                    check_mode: fuzz, check_tracker: 'yes', check_meta: 'content-plan-bosses'}
          # Every composing pack at once on the forced content plan (#133 PR 9):
          # the bosses meta with cups, crystals, boss cups and all packs on, from
          # .github/fuzz/content-plan-full-meta.yaml, under the same cap.
          - {check_name: content-plan-full,           check_runs: 1000, check_hook: '',                                                          check_mode: fuzz, check_meta: 'content-plan-full'}
          - {check_name: content-plan-full-ut,        check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook',                                    check_mode: fuzz, check_tracker: 'yes', check_meta: 'content-plan-full'}
          # Original Gem Cups on the forced content plan (one generator row 2):
          # the default item pool, so Platinum 0, the surface items and relic
          # checks that follow the item counts are in every seed, with three and
          # seven cups under each cup track value. The arm name carries both;
          # .github/fuzz/content-plan-gem-cups-meta.yaml holds the rest.
          - {check_name: gem-cups-3-off,              check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'gem-cups-3-off'}
          - {check_name: gem-cups-3-random,           check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'gem-cups-3-random'}
          - {check_name: gem-cups-3-no-repeats,       check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'gem-cups-3-random_no_repeats'}
          - {check_name: gem-cups-7-off,              check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'gem-cups-7-off'}
          - {check_name: gem-cups-7-random,           check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'gem-cups-7-random'}
          - {check_name: gem-cups-7-no-repeats,       check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'gem-cups-7-random_no_repeats'}
          - {check_name: gem-cups-ut,                 check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook',                                    check_mode: fuzz, check_tracker: 'yes', check_meta: 'gem-cups-7-off'}
          # Pad placement and requirements (one generator row 3): the vanilla-shape
          # plan at each unlock mode, pad_layout.placement and two_stage_density,
          # accessibility full. .github/fuzz/content-plan-pads-meta.yaml holds the rest.
          - {check_name: pads-vanilla-vanilla,       check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-vanilla-vanilla-full'}
          - {check_name: pads-vanilla-within,        check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-vanilla-shuffle_within_kind-full'}
          - {check_name: pads-vanilla-shuffle,       check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-vanilla-shuffle-full'}
          - {check_name: pads-within,                check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-randomized-shuffle_within_kind-full'}
          - {check_name: pads-no-4-keys,             check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-random_without_4_keys-shuffle-full'}
          - {check_name: pads-density-off,           check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-randomized-shuffle-off'}
          - {check_name: pads-density-light,         check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-randomized-shuffle-light'}
          - {check_name: pads-density-standard,      check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-randomized-shuffle-standard'}
          - {check_name: pads-density-deep,          check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-randomized-shuffle-deep'}
          - {check_name: pads-density-full,          check_runs: 500,  check_hook: '',                                                          check_mode: fuzz, check_meta: 'pads-randomized-shuffle-full'}
          - {check_name: pads-ut,                     check_runs: 500,  check_hook: 'hooks.ctr_ut_hook:Hook',                                    check_mode: fuzz, check_tracker: 'yes', check_meta: 'pads-vanilla-shuffle-full'}
    steps:
      - name: Checkout index repo scripts (canonical generation check)
        uses: actions/checkout@v4
        with:
          repository: dowlle/Archipelago-index
          path: index-repo
      - name: Checkout .github/fuzz (fuzz metas and the CTR tracker hook)
        if: matrix.check_meta == 'content-plan' || matrix.check_meta == 'content-plan-cups' || matrix.check_meta == 'content-plan-bosses' || matrix.check_meta == 'content-plan-full' || startsWith(matrix.check_meta, 'gem-cups-') || startsWith(matrix.check_meta, 'pads-') || matrix.check_tracker == 'yes'
        uses: actions/checkout@v4
        with:
          path: world-src
          sparse-checkout: .github/fuzz
      - name: Checkout fuzz hooks
        if: matrix.check_mode == 'fuzz'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FUZZ_HOOKS_REPO }}
          ref: ${{ env.FUZZ_HOOKS_REF }}
          path: fuzz-hooks
      - name: Setup Archipelago
        uses: Eijebong/ap-actions/setup-ap@main
        with:
          version: ${{ env.AP_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stage hooks, empty.apworld and fuzz.py
        if: matrix.check_mode == 'fuzz'
        shell: bash
        run: |
          set -euo pipefail
          cp -r fuzz-hooks/hooks archipelago/hooks
          cp fuzz-hooks/empty.apworld archipelago/custom_worlds/empty.apworld
          curl -SsL --fail -o archipelago/fuzz.py \
            "https://raw.githubusercontent.com/Eijebong/Archipelago-fuzzer/${FUZZER_COMMIT}/fuzz.py"
      - name: Install the pinned Universal Tracker world
        if: matrix.check_tracker == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          curl -SsL --fail -o archipelago/custom_worlds/tracker.apworld \
            "https://github.com/FarisTheAncient/Archipelago/releases/download/Tracker_${TRACKER_VERSION}/tracker.apworld"
          echo "${TRACKER_SHA256}  archipelago/custom_worlds/tracker.apworld" | sha256sum -c -
          # The tracker reads settings.universal_tracker.player_files_path, which
          # defaults to "Players" and is a UserFolderPath: reading it raises
          # FileNotFoundError when the folder does not exist. A fresh Archipelago
          # checkout has no Players folder, so without this line every generation
          # the hook inspects fails. A developer's own Archipelago install has
          # one already, which is why the local fuzz matrix never saw this.
          mkdir -p archipelago/Players
      - name: Stage the CTR tracker hook (compares by location id)
        if: matrix.check_hook == 'hooks.ctr_ut_hook:Hook'
        shell: bash
        run: cp world-src/.github/fuzz/ctr_ut_hook.py archipelago/hooks/ctr_ut_hook.py
      - uses: actions/download-artifact@v4
        with:
          name: ctr.apworld
          path: packed
      - name: Install the packed apworld
        shell: bash
        run: |
          set -euo pipefail
          cp packed/ctr.apworld archipelago/custom_worlds/ctr.apworld
          echo "sha256 $(sha256sum archipelago/custom_worlds/ctr.apworld | cut -d' ' -f1) (pack job said ${{ needs.pack.outputs.sha256 }})"
      - name: Run generation check
        shell: bash
        working-directory: archipelago
        env:
          CHECK_NAME: ${{ matrix.check_name }}
          CHECK_RUNS: ${{ matrix.check_runs }}
          CHECK_HOOK: ${{ matrix.check_hook }}
          CHECK_MODE: ${{ matrix.check_mode }}
          CHECK_META: ${{ matrix.check_meta }}
        run: |
          set -euo pipefail
          echo "=== ${CHECK_NAME} (${CHECK_RUNS} runs) ==="
          if [ "$CHECK_MODE" = "canonical" ]; then
            uv run python ../index-repo/.github/scripts/check_canonical_generation.py \
              --module ctr --artifact-dir canonical_output --seed 0
            exit 0
          fi
          extra_args=()
          if [ -n "$CHECK_HOOK" ]; then
            extra_args+=(--hook "$CHECK_HOOK")
          fi
          if [ "$CHECK_META" = "accessibility-full" ]; then
            printf 'Crash Team Racing:\n  accessibility: full\n  custom_tracks: {}\n' > ci_meta.yaml
            cat ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "check-ut-custom-tracks" ]; then
            cp ../world-src/.github/fuzz/check-ut-custom-tracks-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan" ]; then
            cp ../world-src/.github/fuzz/content-plan-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-cups" ]; then
            cp ../world-src/.github/fuzz/content-plan-cups-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-bosses" ]; then
            cp ../world-src/.github/fuzz/content-plan-bosses-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan-full" ]; then
            cp ../world-src/.github/fuzz/content-plan-full-meta.yaml ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [[ "$CHECK_META" == gem-cups-* ]]; then
            IFS=- read -r _ _ cups cup_tracks <<< "$CHECK_META"
            sed -e "s/__COUNT__/$cups/" -e "s/__TRACKS__/$cup_tracks/" ../world-src/.github/fuzz/content-plan-gem-cups-meta.yaml > ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          uv run python fuzz.py -j 2 -g ctr -r "$CHECK_RUNS" -n 1 -t 120 "${extra_args[@]}" | tee fuzz.log
          if [[ "$CHECK_META" == pads-* ]]; then
            IFS=- read -r _ unlock placement density <<< "$CHECK_META"
            sed -e "s/__UNLOCK__/$unlock/" -e "s/__PLACEMENT__/$placement/" -e "s/__DENSITY__/$density/" ../world-src/.github/fuzz/content-plan-pads-meta.yaml > ci_meta.yaml
            extra_args+=(-m ci_meta.yaml)
          fi
          if [ "$CHECK_META" = "content-plan" ] || [ "$CHECK_META" = "content-plan-cups" ] || [ "$CHECK_META" = "content-plan-bosses" ] || [ "$CHECK_META" = "content-plan-full" ] || [[ "$CHECK_META" == gem-cups-* ]] || [[ "$CHECK_META" == pads-* ]]; then
            # A refused option set is "ignored", not a failure. If the meta file
            # stopped matching the profile, every seed would be ignored and the
            # arm would pass without testing anything, so cap the ignored share.
            ignored="$(grep -oE '[0-9]+ ignored' fuzz.log | tail -1 | cut -d' ' -f1)"
            echo "content-plan ignored: ${ignored:-unknown} of ${CHECK_RUNS}"
            if [ -z "$ignored" ] || [ "$ignored" -gt $((CHECK_RUNS / 10)) ]; then
              echo "::error::content-plan arm: too many ignored generations (${ignored:-unknown} of ${CHECK_RUNS})"
              exit 1
            fi
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.check_name }}
          path: |
            archipelago/fuzz_output
            archipelago/canonical_output
          if-no-files-found: ignore
          retention-days: 14
