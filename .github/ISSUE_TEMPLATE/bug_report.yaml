name: Bug report (generation, options or logic)
description: Generation failed, or an option or logic rule is not doing what it says.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is the **Crash Team Racing world and its randomization logic**.

        - Something wrong **in the game itself** (crashes, display, controls, Linux and Steam Deck):
          file at [dowlle/ctr-native-ap](https://github.com/dowlle/ctr-native-ap/issues/new/choose).
        - A seed you **cannot finish**: use the "Stuck or impossible seed" form here.
        - Something wrong in **Archipelago core**, not CTR: report upstream at
          [ArchipelagoMW/Archipelago](https://github.com/ArchipelagoMW/Archipelago/issues).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
      placeholder: |
        I turned battle arenas off, but the seed still expects me to do the
        Crystal Bonus Round checks.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did this happen?
      options:
        - Generating locally (Archipelago Launcher or the command line)
        - Generating on the archipelago.gg website
        - While playing, after generation succeeded
        - In the APWorld Manager or when installing the apworld
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: APWorld version and Archipelago version
      description: |
        The apworld version is in the release you downloaded, and is also shown in the
        APWorld Manager. Please give both: the world declares a minimum Archipelago
        version and mismatches produce confusing errors.
      placeholder: ctr 0.1.4 on Archipelago 0.6.7
    validations:
      required: true

  - type: input
    id: client-version
    attributes:
      label: Game client version, if you were playing
      description: |
        On the `[AP BOOT]` line at the top of `ctr-ap.log`. The client and the apworld ship
        as a matched pair, so a mismatch is worth ruling out first.
      placeholder: v0.1.4
    validations:
      required: false

  - type: textarea
    id: traceback
    attributes:
      label: The full error message or traceback
      description: |
        Paste all of it, not just the last line. For local generation the log is usually
        under `Archipelago/logs`.
      render: shell
    validations:
      required: false

  - type: textarea
    id: yaml
    attributes:
      label: Your YAML
      description: |
        Required. If more than one YAML was in the generation, include all of them, or at
        least all the CTR ones. Nearly every issue found so far has come down to a
        specific option or a combination of them.
      render: yaml
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: Does it happen again with the same YAML?
      description: |
        This matters more than it looks. A failure that happens every time is a logic bug.
        A failure that happens on maybe one generation in a few thousand is a fill
        collision, and the two are chased in completely different ways.
      options:
        - Every time with this YAML
        - Sometimes, rerolling eventually works
        - Happened once, have not retried
        - Have not tried again
    validations:
      required: true

  - type: dropdown
    id: solo-or-multi
    attributes:
      label: Solo or multiworld?
      options:
        - Solo (only CTR in the room)
        - Multiworld with other games
        - Multiworld with more than one CTR slot
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the spoiler log, or anything else that seemed relevant.
    validations:
      required: false
