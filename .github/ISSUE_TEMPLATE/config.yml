# This repository holds the CTR world code only. Issues for the whole project,
# including generation, options and logic, are filed on the game client
# repository so players have one place to look. Blank issues are off here.
blank_issues_enabled: false
contact_links:
  - name: Report a bug, a stuck seed or an idea
    url: https://github.com/dowlle/ctr-native-ap/issues/new/choose
    about: One issue tracker for the whole project. Generation, option and logic problems use the "Stuck or impossible seed" form there and are labelled apworld.
  - name: Setup and troubleshooting guide
    url: https://github.com/dowlle/ctr-native-ap/blob/main/SETUP.md
    about: Installing, extracting your disc, connecting to a room, and the common fixes.
  - name: What the options do
    url: https://github.com/dowlle/ctr-archipelago-apworld/blob/main/worlds/ctr/README.md
    about: The CTR world README, its options and how the randomization is put together.
  - name: An Archipelago core problem, not CTR
    url: https://github.com/ArchipelagoMW/Archipelago/issues
    about: This repository is a fork carrying the CTR world. Bugs in Archipelago itself belong upstream.
