# Forced ctr_first arm (#208, ctr-first and ctr-first-ut in
# .github/workflows/ctr-world.yml). Every seed runs the Trophy Race-free
# adventure structure: each track's CTR Challenge is its stage-1 race and its
# win also earns the Trophy Race check. Both trial tracks offer a CTR
# Challenge, so they can serve ctr_first; Cortex Vortex is drawn by the
# fuzzer. Everything else is randomized, including the race type selector,
# Lettersanity, Progressive Boost, two-stage density and destination shuffle.
# accessibility: full makes an unreachable stage-1 or stage-2 location a
# failure, and under the tracker a divergence between server and tracker.
Crash Team Racing:
  accessibility: full
  custom_tracks: {}
  adventure_structure: ctr_first
  slide_coliseum_races: trophy_and_ctr_challenge
  turbo_track_races: trophy_and_ctr_challenge
