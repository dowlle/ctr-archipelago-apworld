# Content-plan bosses arm (#133 PR 6), used by .github/workflows/ctr-world.yml.
# The content-plan cups meta (content-plan-meta.yaml explains every pinned
# option) with content_pool.bosses.enabled: true, so the five garages hold
# their encounters: the four boss races and, unless oxide_goal is disabled,
# N. Oxide's two challenges. The goal options are drawn (oxide_goal over all
# four values, bosses_required_goal 0 to 4, gems_required_goal 0, 1, 3 or 5),
# so the Oxide, Boss and Gem arms and the companion terms on the Oxide
# encounters reach the fill. Boss Track Shuffle with its repeat policy, the
# Final Challenge track, its relic mode and count, and oxide_1_optional
# (mandatory or optional; filler refuses on content plans) are drawn too.
# The venue allow and block lists stay empty: random lists refuse most draws.
# Since #133 PR 6b each ordinary garage rolls its own requirement from the
# base supply (content_bosses.draw_requirements, level high), Baby T Park
# states its restart points and AI navigation so Boss Track Shuffle can draw
# it as a venue, and zero to two garages hold a boss cup. The base Trophy
# count stays 16 (5 in the other content-plan metas). Zero to four cups keep
# the cups and the boss checks in one fill. A goal with no arm is refused,
# about one roll in forty.
# Relic checks follow the item counts since one generator row 2, so relic items
# no longer leave spare checks: per-racer boost and letter items lean low to keep
# the ignored share under the arm's cap.
Crash Team Racing:
  accessibility: full
  # Job J11: content plans take the Wumpa Shop, the Wumpa goal and ctr_first.
  # Weighted so most seeds carry the shop and the goal, and one in four runs
  # ctr_first; a large `excluded` shop or a ctr_first start behind letter
  # items can refuse, so the weights keep the ignored share under the cap.
  goal_wumpa: {0: 2, 300: 1, 2500: 1}
  wumpa_shop_slots: {0: 1, 2: 1, 5: 1, 10: 1}
  adventure_structure: {classic: 3, ctr_first: 1}
  content_pool:
    preset: mixed
    tracks:
      retail: all
      cortex_vortex: true
      modes: [trophy, ctr, relic]
      custom:
        - id: package/baby-t-park/1.0.2
          content_id: baby-t-park
          uuid: 2c7c7846-2ead-5b8f-a218-beca5792106e
          revision: "1.0.2"
          display_name: Baby T Park
          author: Lockheart
          laps: 7
          capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: true, wumpa: true, super_turbo_pads: true, weapon_crates: 8, checkpoints: 35, ai_nav: true}
          files:
            - {role: lev, sha256: be161e0b11aa03505c501b7db012d830405e69e171f84633c2e24ffe9cc3cbf8, bytes: 2558168, format: ctr-lev, format_version: 1}
            - {role: vrm, sha256: 1a0ff56b51562292ecc30c14e7a2e6d315f641feaa00990d4242abe46434f692, bytes: 458808, format: ctr-vrm, format_version: 1}
          evidence: []
        - id: package/fuzz-fixture-loop/1.0
          content_id: fuzz-fixture-loop
          uuid: 0f0e0d0c-0b0a-4908-8706-0504030201ff
          revision: "1.0"
          display_name: Fuzz Fixture Loop
          author: Fixture Author
          laps: 3
          capabilities: {time_trial: true, arcade: true, relic: true, ctr_tokens: false, wumpa: false, super_turbo_pads: true, weapon_crates: 12}
          relic_targets: {sapphire: 96000, gold: 86400, platinum: 76800}
          files:
            - {role: lev, sha256: a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1, bytes: 1234567, format: ctr-lev, format_version: 1}
            - {role: vrm, sha256: b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2, bytes: 458808, format: ctr-vrm, format_version: 1}
          evidence: []
    cups: {count: {min: 0, max: 4}}
    crystals: {count: {min: 0, max: 4}}
    bosses: {enabled: true, cups: {min: 0, max: 2}}
    required_entries: [custom/baby-t-park/1.0.2, custom/fuzz-fixture-loop/1.0]
  pad_layout: {placement: shuffle, stages: two, mode_order: per_pad, merge_trophy_ctr: false}
  item_pool:
    base:
      trophies: 16
      relics: {sapphire: 6, gold: 4, platinum: 2}
      tokens: {red: 2, green: 2, blue: 2, yellow: 0, purple: 0}
      gems: [red, green, blue, yellow, purple]
      keys: 4
  oxide_goal: {any_percent: 3, 101_percent: 3, none: 1, disabled: 1}
  bosses_required_goal: {0: 2, 1: 1, 2: 1, 3: 1, 4: 1}
  gems_required_goal: {0: 1, 1: 1, 3: 1, 5: 1}
  oxide_1_optional: {mandatory: 1, optional: 1}
  oxide_final_track: {cortex_vortex: 1, oxide_station: 1}
  oxide_final_challenge_unlock: {sapphire_relics: 2, gold_relics: 1, platinum_relics: 1, any_relic_type: 1, total_relics: 1}
  boss_encounter_repeats: {disallow: 1, allow: 1}
  oxide_final_challenge_relic_count: {1: 1, 4: 1, 12: 1, 18: 1, 30: 1}
  boss_track_allowlist: []
  boss_track_blocklist: []
  custom_tracks: {}
  cortex_vortex_track: false
  progressive_boost: {"off": 2, shared_global: 2, per_character: 1}
  progressive_stats: {"off": 1, shared_global: 1}
  lettersanity: {"off": 2, locations_only: 3, locations_and_items: 1, items_only: 1}
  letters_per_track: {1: 1, 2: 1, 3: 1}
  podium_placement_checks: {true: 7, false: 1}
  podium_held_rungs: {true: 3, false: 1}
  podium_held_fifth_rung: {true: 1, false: 1}
  podium_finish_rungs: {true: 1, false: 1}
  podium_any_position_rung: {true: 1, false: 1}
  wumpa_check: {global: 1, per_track: 7}
  relic_perfect_checks: true
  boss_track_shuffle: {true: 1, false: 1}
  # The opponent and kit switches compose with boss cups. The gauntlet needs the
  # Purple Gem Cup, so it has its own arms.
  boss_opponent_shuffle: {false: 1, true: 1}
  boss_kit_shuffle: {false: 1, true: 1}
  boss_oxide_in_pool: false
  purple_cup_boss_gauntlet: false
  oxide_attack_profile: {retail: 1, all_compatible: 1}
  oxide_powerup_blocklist: []
  warp_pad_rules: {}
  # Keys stay shuffled here; the pads-fixed arms fix them.
  shuffle_keys: true
  # Random lists refuse most boss draws, and the gauntlet has its own arms.
  boss_character_allowlist: []
  boss_character_blocklist: []
  boss_powerup_blocklist: []
