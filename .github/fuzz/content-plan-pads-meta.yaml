# Pad placement and requirements arms (one generator row 3), used by
# .github/workflows/ctr-world.yml. The original Gem Cups meta
# (content-plan-gem-cups-meta.yaml explains the pinned options) at the default
# item pool, five cups and four Crystal Challenges, so custom tracks and Cortex
# Vortex reach the pads beside the 18 retail tracks and some of them drop out.
# The workflow fills in the unlock mode, the pad placement and the stage density
# from the arm's name. `accessibility: full` makes a generated seed the proof
# that every pad mix is reachable.
Crash Team Racing:
  accessibility: full
  content_pool:
    preset: mixed
    tracks:
      retail: all
      cortex_vortex: true
      modes: [trophy, ctr, relic]
      custom:
        - id: package/baby-t-park/1.0.2
          content_id: baby-t-park
          uuid: 2c7c7846-2ead-5b8f-a218-beca5792106e
          revision: "1.0.2"
          display_name: Baby T Park
          author: Lockheart
          laps: 7
          capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: true, wumpa: true, super_turbo_pads: true, weapon_crates: 8, checkpoints: 35, ai_nav: true}
          files:
            - {role: lev, sha256: be161e0b11aa03505c501b7db012d830405e69e171f84633c2e24ffe9cc3cbf8, bytes: 2558168, format: ctr-lev, format_version: 1}
            - {role: vrm, sha256: 1a0ff56b51562292ecc30c14e7a2e6d315f641feaa00990d4242abe46434f692, bytes: 458808, format: ctr-vrm, format_version: 1}
          evidence: []
        - id: package/fuzz-fixture-loop/1.0
          content_id: fuzz-fixture-loop
          uuid: 0f0e0d0c-0b0a-4908-8706-0504030201ff
          revision: "1.0"
          display_name: Fuzz Fixture Loop
          author: Fixture Author
          laps: 3
          capabilities: {time_trial: true, arcade: true, relic: true, ctr_tokens: false, wumpa: false, super_turbo_pads: true, weapon_crates: 12}
          relic_targets: {sapphire: 96000, gold: 86400, platinum: 76800}
          files:
            - {role: lev, sha256: a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1, bytes: 1234567, format: ctr-lev, format_version: 1}
            - {role: vrm, sha256: b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2, bytes: 458808, format: ctr-vrm, format_version: 1}
          evidence: []
    cups: {count: 5}
    crystals: {count: 4}
    bosses: {enabled: true, cups: {min: 0, max: 2}}
    required_entries: [custom/baby-t-park/1.0.2, custom/fuzz-fixture-loop/1.0]
  pad_layout: {placement: __PLACEMENT__, stages: two, mode_order: per_pad, merge_trophy_ctr: false}
  warppad_unlock_requirements: __UNLOCK__
  two_stage_density: "__DENSITY__"
  oxide_goal: {any_percent: 3, 101_percent: 3, none: 1, disabled: 1}
  bosses_required_goal: {0: 2, 1: 1, 2: 1, 3: 1, 4: 1}
  gems_required_goal: {0: 1, 1: 1, 3: 1, 5: 1}
  oxide_1_optional: {mandatory: 1, optional: 1}
  oxide_final_track: {cortex_vortex: 1, oxide_station: 1}
  oxide_final_challenge_unlock: {sapphire_relics: 2, gold_relics: 1, any_relic_type: 1, total_relics: 1}
  oxide_final_challenge_relic_count: {1: 1, 4: 1, 12: 1, 18: 1, 30: 1}
  boss_encounter_repeats: {disallow: 1, allow: 1}
  boss_track_allowlist: []
  boss_track_blocklist: []
  custom_tracks: {}
  cortex_vortex_track: false
  progressive_boost: {"off": 2, shared_global: 2, per_character: 1}
  progressive_stats: {"off": 1, shared_global: 1}
  lettersanity: {"off": 2, locations_only: 3, locations_and_items: 1}
  letters_per_track: {1: 1, 2: 1, 3: 1}
  podium_placement_checks: {true: 7, false: 1}
  podium_held_rungs: {true: 3, false: 1}
  podium_held_fifth_rung: {true: 1, false: 1}
  podium_finish_rungs: {true: 1, false: 1}
  podium_any_position_rung: {true: 1, false: 1}
  wumpa_check: {global: 1, per_track: 7}
  relic_perfect_checks: true
  boss_track_shuffle: {true: 1, false: 1}
  warp_pad_rules: {}
  # The Wumpa Shop is on by default; these arms roll it, and the row 5 overlays
  # (.github/fuzz/overlays) set everything else row 5 added. A random gauntlet
  # roll is refused without the kit switch, so it stays off here.
  wumpa_shop_slots: {0: 1, 5: 1, 10: 2}
  purple_cup_boss_gauntlet: false
  # Keys stay shuffled here; the pads-fixed arms fix them.
  shuffle_keys: true
  # Random lists refuse most boss draws, and the gauntlet has its own arms.
  boss_character_allowlist: []
  boss_character_blocklist: []
  boss_powerup_blocklist: []
  oxide_powerup_blocklist: []
  remove_playable_oxide: {false: 3, true: 1}
