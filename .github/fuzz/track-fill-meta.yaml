# Keep unrelated options at their packed defaults. Seeds still vary the
# layout and mode order while always using a filled Relic Race, and always
# race Arabian Heights Day's 27 filled weapon crates (WF1) at varied Item Box
# and Itemboxsanity counts. WF1b: Itemsanity and Hit Character route through
# the filled crates no AP box takes over, so both vary too.
Crash Team Racing:
  accessibility: full
  track_fill: true
  race_mode_order: {fixed: 1, per_pad: 1}
  relic_perfect_checks: true
  item_box_count: {0: 1, 15: 2, 50: 1}
