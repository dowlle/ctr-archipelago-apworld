# Universal Tracker arm with a custom track (check-ut-custom-tracks in
# .github/workflows/ctr-world.yml). Every seed gives Baby T Park, Inferno Island
# and Assembly Lane a pad with their pinned package descriptors. The rest is randomized by the
# fuzzer, as in the check-ut arm. accessibility: full makes a tracker
# divergence show up as checks the server reached and the tracker did not.
Crash Team Racing:
  accessibility: full
  lettersanity: locations_and_items
  letters_per_track: 3
  track_origin_letters: true
  placed_track_letters: true
  track_modes: {default: [trophy, ctr, relic], inferno-island: [trophy, ctr], assembly-lane-n-gage: [trophy, ctr]}
  custom_tracks:
    - id: package/baby-t-park/1.0.2
      content_id: baby-t-park
      uuid: 2c7c7846-2ead-5b8f-a218-beca5792106e
      revision: "1.0.2"
      display_name: Baby T Park
      author: Lockheart
      laps: 7
      capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: true, wumpa: true, super_turbo_pads: true, weapon_crates: 8, checkpoints: 35, ai_nav: true}
      files:
        - {role: lev, sha256: be161e0b11aa03505c501b7db012d830405e69e171f84633c2e24ffe9cc3cbf8, bytes: 2558168, format: ctr-lev, format_version: 1}
        - {role: vrm, sha256: 1a0ff56b51562292ecc30c14e7a2e6d315f641feaa00990d4242abe46434f692, bytes: 458808, format: ctr-vrm, format_version: 1}
      evidence: []
    - id: package/inferno-island/1.3.0
      content_id: inferno-island
      uuid: 8727e109-c839-5382-9547-e2730ac77906
      revision: "1.3.0"
      display_name: Inferno Island
      author: Boxic
      laps: 3
      capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: true, wumpa: true, super_turbo_pads: false, weapon_crates: 17, checkpoints: 70, ai_nav: true}
      files:
        - {role: lev, sha256: d8863cf0274fc29ac8e2118e666604ddc80ebbe49d5c747dd91acec6a07dfd32, bytes: 870760, format: ctr-lev, format_version: 1}
        - {role: vrm, sha256: 9231bdf31d37808e6951d34bd808da7c7ea9cbc417fcd4d80f956b413b3b95e2, bytes: 458808, format: ctr-vrm, format_version: 1}
      evidence: []
    - id: package/assembly-lane-n-gage/1.0.0
      content_id: assembly-lane-n-gage
      uuid: 8b5cce31-99f0-59b3-a456-8efbe0e0b602
      revision: "1.0.0"
      display_name: N-Gage Assembly Lane
      author: Anfrost
      laps: 3
      capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: false, wumpa: false, checkpoints: 255, ai_nav: true}
      files:
        - {role: lev, sha256: b646db4e5564827ca228f08c3f9159593790203ab57b5bf8244bcc909353edae, bytes: 1207856, format: ctr-lev, format_version: 1}
        - {role: vrm, sha256: 2620d0f6b92d23497962ac1dcfa0dd6f283d44057a67918f72aa85db943aa723, bytes: 458808, format: ctr-vrm, format_version: 1}
      evidence: []
  required_entries: [baby-t-park, inferno-island, assembly-lane-n-gage]
  # Random sets and switches here refuse most seeds, and a refused seed tests
  # nothing: Crystal Challenge Count above the listed arenas, cups the listed
  # tracks cannot fill, a boss pool too small, a gauntlet without its parts, and
  # empty garages under an Oxide goal. The other arms cover what these leave out.
  retail_tracks: [all]
  crystal_arenas: [Skull Rock, Rampage Ruins, Rocky Road, Nitro Court, Parking Lot, The North Bowl, Lab Basement]
  boss_garages: true
  purple_cup_boss_gauntlet: false
  boss_character_pool: [Crash Bandicoot, Coco Bandicoot, Polar, Pura, Neo Cortex, N. Tropy, Ripper Roo, Papu Papu, Komodo Joe, Pinstripe, Dingodile, Tiny Tiger, N. Gin, Fake Crash, Penta Penguin]
  boss_weapon_pool: [tnt, potion, bomb, missile, turbo, shield, mask, clock, warp_orb, invisibility]
  oxide_weapon_pool: [tnt, potion, bomb, missile, turbo, shield, mask, clock, warp_orb, invisibility, super_engine]
