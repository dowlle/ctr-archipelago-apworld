# Content-plan J11 arm (job J11: decisions 3, 4, 7, 9, 14, 19 to 24 of
# 2026-10-28), used by .github/workflows/ctr-world.yml as content-plan-030 and
# content-plan-030-ut. The content-plan bosses meta
# (content-plan-bosses-meta.yaml and content-plan-meta.yaml explain every
# pinned option) with every J11 feature forced on: adventure_structure
# ctr_first, the Wumpa Shop (2 to 10 slots, allowed or excluded, any price
# percentage) and the Wumpa goal, and Boss Opponent and Kit Shuffle with
# N. Oxide in the pool and N. Oxide's all_compatible profile drawn. Boss cups
# take no drawn opponent or kit yet, so this arm has none; the track
# assignment, kit assignment, intensity and loss easing are drawn, and the
# character and powerup lists stay empty (random lists refuse most draws:
# bosses never repeat). Lettersanity leans to locations only: a ctr_first
# start behind letter items has few open checks and the slot guard refuses
# some of them.
Crash Team Racing:
  accessibility: full
  # Job J11: content plans take the Wumpa Shop, the Wumpa goal and ctr_first.
  # Weighted so most seeds carry the shop and the goal, and one in four runs
  # ctr_first; a large `excluded` shop or a ctr_first start behind letter
  # items can refuse, so the weights keep the ignored share under the cap.
  goal_wumpa: {300: 1, 1000: 1, 4000: 1}
  wumpa_shop_slots: {2: 1, 5: 1, 10: 1}
  wumpa_shop_progression: {allowed: 1, excluded: 1}
  adventure_structure: ctr_first
  content_pool:
    preset: mixed
    tracks:
      retail: all
      cortex_vortex: true
      modes: [trophy, ctr, relic]
      custom:
        - id: package/baby-t-park/1.0.2
          content_id: baby-t-park
          uuid: 2c7c7846-2ead-5b8f-a218-beca5792106e
          revision: "1.0.2"
          display_name: Baby T Park
          author: Lockheart
          laps: 7
          capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: true, wumpa: true, super_turbo_pads: true, weapon_crates: 8, checkpoints: 35, ai_nav: true}
          files:
            - {role: lev, sha256: be161e0b11aa03505c501b7db012d830405e69e171f84633c2e24ffe9cc3cbf8, bytes: 2558168, format: ctr-lev, format_version: 1}
            - {role: vrm, sha256: 1a0ff56b51562292ecc30c14e7a2e6d315f641feaa00990d4242abe46434f692, bytes: 458808, format: ctr-vrm, format_version: 1}
          evidence: []
        - id: package/fuzz-fixture-loop/1.0
          content_id: fuzz-fixture-loop
