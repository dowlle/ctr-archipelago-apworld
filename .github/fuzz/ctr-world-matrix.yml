# .github/fuzz/content-plan-meta.yaml. The rest is randomized.
- {check_name: content-plan,                check_runs: 1000, check_hook: '',                                                          check_mode: fuzz, check_meta: 'content-plan'}
# Universal Tracker on the forced content plan (#133). The meta has a
