# Content-plan fuzz arm (#133 PR 2, modes from PR 3, per-track checks from PR
# 3b), used by .github/workflows/ctr-world.yml. Every seed builds an explicit
# content plan with two custom tracks: Baby T Park 1.0.2 on its named block
# (Trophy and CTR Challenge, measured Wumpa), and a made-up track key with no
# block (path B+, Trophy and Relic Race, no Wumpa, test data, its pins name no
# real files). All three modes are selected, with two stages and a mode order
# drawn per pad, so second-stage gates and every mode reach the fill. Podium
# rungs, Reach 10 Wumpa and Lettersanity are drawn per seed with weights that
# turn each family on in most seeds. The options pinned below are the ones the
# content-plan profile still refuses; everything else is randomized by the
# fuzzer as in the other arms.
Crash Team Racing:
  accessibility: full
  content_pool:
    preset: mixed
    tracks:
      retail: all
      modes: [trophy, ctr, relic]
      custom:
        - id: package/baby-t-park/1.0.2
          content_id: baby-t-park
          uuid: 2c7c7846-2ead-5b8f-a218-beca5792106e
          revision: "1.0.2"
          display_name: Baby T Park
          author: Lockheart
          laps: 7
          capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: true, wumpa: true}
