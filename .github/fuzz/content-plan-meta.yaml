# Content-plan fuzz arm (#133 PR 2, modes from PR 3, per-track checks from PR
# 3b, Cortex Vortex and Relic Race Perfect from PR 3c), used by
# .github/workflows/ctr-world.yml. Every seed builds an explicit
# content plan with two custom tracks: Baby T Park 1.0.2 on its named block
# (Trophy and CTR Challenge, measured Wumpa), and a made-up track key with no
# block (path B+, Trophy and Relic Race, no Wumpa, test data, its pins name no
# real files). All three modes are selected, with two stages and a mode order
# drawn per pad, so second-stage gates and every mode reach the fill. Podium
# rungs, Reach 10 Wumpa and Lettersanity are drawn per seed with weights that
# turn each family on in most seeds. Cortex Vortex is selected as a track (the
# 21 candidate tracks all fit the 27 pads, so it is in every plan) and Relic
# Race Perfect checks are on in most seeds. Progressive Starting Wumpa, Turbo
# Grant, Tizi Helper, an explicit DeathLink send list and the warp-pad display
# settings (PR 4a) are left to the fuzzer, and so are Character Unlocks,
# Remove Playable Oxide, Racer-Locked Warp Pads, Starting Stat Class, Penta
# Penguin Stats and Editable Stats (PR 4b), and Progressive Boost with Blue
# Fire, Progressive Stats, Logic Difficulty and Shortcut Knowledge (PR 4c).
# Baby T Park states its measured super turbo pads (six trigger quads) but
# is ruled generic terms only (2026-10-18), and the fixture loop states super
# pads and has no ruling, so it needs USF to finish: both custom-track boost
# rules reach the fill. Progressive Stats is drawn off or shared only: its 192 per-racer
# copies do not fit this profile's checks, so per_character would only be
# refused by the item ledger. Podium rungs, per-track Wumpa and Relic Race
# Perfect checks are on in most seeds, Lettersanity leans to the modes with
# letter checks and held rungs (free at the start) are on in most seeds (PR
# 4c): with the boost and racer items, plans with few checks did not fit the
# ledger or started too narrow, and pushed the ignored share over the arm's
# cap. Itemsanity and Hit Character (PR 4d) are left to the fuzzer: their
# global checks route from every race of the plan, and with both custom
# tracks and every retail track in each plan, the custom-track routes and the
# guest routes on retail races both reach the fill. Item Box Locations with
# Shortcut Knowledge and Item Box Colours (PR 4e) are left to the fuzzer:
# every retail track keeps its frozen boxes, Baby T Park states its eight
# measured weapon crates and takes Item Box 1 to 8 on its named block, and the
# fixture loop states twelve crates but has no box ids on its generic slot.
# plando_items and item_links (PR 4f) are no longer refused; the fuzzer never
# randomizes either and generates one slot per seed, so a separate
# multi-slot run covers them (see the PR).
# The options pinned below
# are the ones the
# content-plan profile still refuses; everything else is randomized by the
# fuzzer as in the other arms.
# Relic checks follow the item counts since one generator row 2, so relic items
# no longer leave spare checks: per-racer boost and letter items lean low to keep
# the ignored share under the arm's cap.
Crash Team Racing:
  accessibility: full
  # Job J11: content plans take the Wumpa Shop, the Wumpa goal and ctr_first.
  # Weighted so most seeds carry the shop and the goal, and one in four runs
  # ctr_first; a large `excluded` shop or a ctr_first start behind letter
  # items can refuse, so the weights keep the ignored share under the cap.
  goal_wumpa: {0: 2, 300: 1, 2500: 1}
  wumpa_shop_slots: {0: 1, 2: 1, 5: 1, 10: 1}
  adventure_structure: {classic: 3, ctr_first: 1}
  content_pool:
    preset: mixed
    tracks:
      retail: all
      cortex_vortex: true
      modes: [trophy, ctr, relic]
      custom:
        - id: package/baby-t-park/1.0.2
          content_id: baby-t-park
          uuid: 2c7c7846-2ead-5b8f-a218-beca5792106e
          revision: "1.0.2"
          display_name: Baby T Park
          author: Lockheart
          laps: 7
          capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: true, wumpa: true, super_turbo_pads: true, weapon_crates: 8}
          files:
            - {role: lev, sha256: be161e0b11aa03505c501b7db012d830405e69e171f84633c2e24ffe9cc3cbf8, bytes: 2558168, format: ctr-lev, format_version: 1}
            - {role: vrm, sha256: 1a0ff56b51562292ecc30c14e7a2e6d315f641feaa00990d4242abe46434f692, bytes: 458808, format: ctr-vrm, format_version: 1}
          evidence: []
        - id: package/fuzz-fixture-loop/1.0
          content_id: fuzz-fixture-loop
          uuid: 0f0e0d0c-0b0a-4908-8706-0504030201ff
          revision: "1.0"
          display_name: Fuzz Fixture Loop
          author: Fixture Author
          laps: 3
          capabilities: {time_trial: true, arcade: true, relic: true, ctr_tokens: false, wumpa: false, super_turbo_pads: true, weapon_crates: 12}
          relic_targets: {sapphire: 96000, gold: 86400, platinum: 76800}
          files:
            - {role: lev, sha256: a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1, bytes: 1234567, format: ctr-lev, format_version: 1}
            - {role: vrm, sha256: b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2, bytes: 458808, format: ctr-vrm, format_version: 1}
          evidence: []
    cups: {count: 0}
    crystals: {count: 0}
    bosses: {enabled: false}
    required_entries: [custom/baby-t-park/1.0.2, custom/fuzz-fixture-loop/1.0]
  pad_layout: {placement: shuffle, stages: two, mode_order: per_pad, merge_trophy_ctr: false}
  item_pool:
    base:
      trophies: 5
      relics: {sapphire: 6, gold: 4, platinum: 2}
      tokens: {red: 2, green: 2, blue: 2, yellow: 0, purple: 0}
      gems: [red, green, blue, yellow, purple]
      keys: 4
  oxide_goal: disabled
  bosses_required_goal: 0
  gems_required_goal: {1: 1, 3: 1, 5: 2}
  custom_tracks: {}
  cortex_vortex_track: false
  progressive_boost: {"off": 2, shared_global: 2, per_character: 1}
  progressive_stats: {"off": 1, shared_global: 1}
  lettersanity: {"off": 2, locations_only: 3, locations_and_items: 1, items_only: 1}
  letters_per_track: {1: 1, 2: 1, 3: 1}
  podium_placement_checks: {true: 7, false: 1}
  podium_held_rungs: {true: 3, false: 1}
  podium_held_fifth_rung: {true: 1, false: 1}
  podium_finish_rungs: {true: 1, false: 1}
  podium_any_position_rung: {true: 1, false: 1}
  wumpa_check: {global: 1, per_track: 7}
  relic_perfect_checks: true
  boss_track_shuffle: false
  # Bosses are off here: the opponent, kit and N. Oxide switches need the
  # garages (job J11), so they stay off; content-plan-030-meta.yaml forces them.
  boss_opponent_shuffle: false
  boss_kit_shuffle: false
  boss_oxide_in_pool: false
  purple_cup_boss_gauntlet: false
  oxide_attack_profile: retail
  warp_pad_rules: {}
  # Keys stay shuffled here; the pads-fixed arms fix them.
  shuffle_keys: true
  # Random lists refuse most boss draws, and the gauntlet has its own arms.
  boss_character_allowlist: []
  boss_character_blocklist: []
  boss_powerup_blocklist: []
  oxide_powerup_blocklist: []
