# Content-plan vanilla-shape arm (#89 solo custom-track profile, round 2
# decision 4), used by .github/workflows/ctr-world.yml. The shape the Play Solo
# client gives a seed with custom tracks (worlds/ctr/solo/options-overlay.json,
# custom_tracks.profile): 18 race pads, 5 Gem Cups, 4 Crystal Challenges on the
# retail arenas, boss garages on, the retail item quantities and no Cortex
# Vortex track. Retail tracks and the two custom tracks form one pool, so a
# custom track on a pad displaces a retail track and every cup leg draws from
# the same pool. Baby T Park is guaranteed a pad (Own pad); the fixture loop is
# only in the pool (In pool). The goal and boss options and the packs are
# drawn as in the bosses meta (content-plan-meta.yaml explains every pinned
# option), with accessibility: full.
Crash Team Racing:
  accessibility: full
  content_pool:
    preset: mixed
    tracks:
      retail: all
      cortex_vortex: false
      modes: [trophy, ctr, relic]
      custom:
