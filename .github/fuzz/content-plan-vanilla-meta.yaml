# Play Solo with picked custom tracks (#89), used by
# .github/workflows/ctr-world.yml. The YAML a client writes for a Standard seed
# with two tracks picked: the one generator's defaults (18 race pads, 5 Gem Cups,
# 4 Crystal Challenges on the original arenas, the boss garages, the default item
# pool) with Baby T Park on its own pad and the fixture loop in the pool. Original
# and custom tracks share one pool, so a custom track on a pad takes an original
# track's place, and cup legs draw from the same pool. The goal and boss options
# and the packs are drawn as in the bosses meta (content-plan-meta.yaml explains
# every pinned option), with accessibility: full. DeathLink stays to the fuzzer:
# the wrapper forces it off, and it changes nothing in the fill.
