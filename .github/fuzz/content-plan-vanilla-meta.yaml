          content_id: baby-t-park
          uuid: 2c7c7846-2ead-5b8f-a218-beca5792106e
          revision: "1.0.2"
          display_name: Baby T Park
          author: Lockheart
          laps: 7
          capabilities: {time_trial: true, arcade: true, relic: false, ctr_tokens: true, wumpa: true, super_turbo_pads: true, weapon_crates: 8, checkpoints: 35, ai_nav: true}
